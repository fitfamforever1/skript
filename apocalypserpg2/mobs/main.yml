shambler:
  Type: zombie
  Health: 20
  Damage: 3
  Faction: zombie
  Options:
    MovementSpeed: 0.16
    MaxCombatDistance: 64
    FollowRange: 32
    KnockbackResistance: 0.9
    Invisible: false
    Despawn: true
    NoGravity: false
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
    Baby: false
    Scale: 1
  Skills:
  - command{cmd="infect <target.name>";asOp=true} @trigger ~onAttack 0.1
  - command{cmd="gainxp <target.name> 5";asOp=true} @trigger ~onDeath

